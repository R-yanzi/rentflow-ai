[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rentflow-ai"
version = "0.1.0"
description = "Enterprise intelligent rental agent platform"
requires-python = ">=3.12,<3.13"

# 这里先只安装启动 FastAPI 所需的最小依赖。
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",

    # SQLAlchemy 负责 ORM 和数据库会话管理。
    "sqlalchemy[asyncio]>=2.0,<3.0",

    # asyncpg 是 PostgreSQL 的异步驱动。
    "asyncpg>=0.30,<1.0",

    # Alembic 后续负责数据库结构迁移。
    "alembic>=1.16,<2.0",

    # 让 SQLAlchemy 支持 PostGIS 的 Geography、Geometry 等类型。
    "geoalchemy2>=0.18,<1.0",

    # 将 PostGIS 返回的二进制空间对象转换为 Python Point。
    "shapely>=2.1,<3.0",

    # DeepSeek 提供 OpenAI-compatible API，因此复用 OpenAI Python SDK。
    "openai>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    # Starlette 1.x 的 TestClient 使用 httpx2。
    "httpx2>=2.0,<3.0",
    "pytest>=8,<10",
    "ruff>=0.11,<1.0",
    "pyright>=1.1,<2.0",
]

# 告诉 setuptools 查找 app 包。
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "F",   # Pyflakes：未定义变量、无效导入等
    "I",   # import 排序
    "B",   # 常见 Python 编程错误
    "UP",  # 建议使用较新的 Python 写法
]

[tool.ruff.lint.isort]
# 明确告诉 Ruff，app 是当前项目的一方包，而不是第三方依赖。
known-first-party = ["app"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app", "scripts", "tests"]
venvPath = "E:/miniconda/envs"
venv = "rentflow-ai"